<svg xmlns="http://www.w3.org/2000/svg" width="960" height="220" viewBox="0 0 960 220" role="img" aria-labelledby="title desc">
  <title id="title">How Snip saves a recent clip</title>
  <desc id="desc">Screen and audio enter a hardware HEVC encoder, stay in a compressed rolling buffer, and become a MOV clip when the user presses a shortcut.</desc>
  <rect width="960" height="220" rx="24" fill="#0b1220"/>
  <text x="30" y="42" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="24" font-weight="700">How Snip works</text>
  <text x="30" y="68" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14">Capture continues in the background. A shortcut saves the recent history.</text>
  <g font-family="-apple-system, BlinkMacSystemFont, sans-serif" text-anchor="middle">
    <rect x="30" y="96" width="190" height="94" rx="15" fill="#16243a" stroke="#3b82f6"/>
    <text x="125" y="133" fill="#f8fafc" font-size="18" font-weight="600">Retina screen</text>
    <text x="125" y="158" fill="#a5b4c8" font-size="14">+ chosen audio</text>
    <rect x="275" y="96" width="190" height="94" rx="15" fill="#16243a" stroke="#22d3ee"/>
    <text x="370" y="133" fill="#f8fafc" font-size="18" font-weight="600">Hardware HEVC</text>
    <text x="370" y="158" fill="#a5b4c8" font-size="14">compressed frames</text>
    <rect x="520" y="96" width="190" height="94" rx="15" fill="#16243a" stroke="#a78bfa"/>
    <text x="615" y="133" fill="#f8fafc" font-size="18" font-weight="600">Rolling buffer</text>
    <text x="615" y="158" fill="#a5b4c8" font-size="14">memory capped</text>
    <rect x="765" y="96" width="165" height="94" rx="15" fill="#102f2b" stroke="#34d399"/>
    <text x="847" y="133" fill="#f8fafc" font-size="18" font-weight="600">.mov clip</text>
    <text x="847" y="158" fill="#a5b4c8" font-size="14">on shortcut</text>
  </g>
  <g fill="none" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M228 143h35m-9-8 9 8-9 8"/>
    <path d="M473 143h35m-9-8 9 8-9 8"/>
    <path d="M718 143h35m-9-8 9 8-9 8"/>
  </g>
</svg>
